<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vulpes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-min" viewBox="0 0 16 16"><path d="M3.5 8.5h9" /></symbol>
        <symbol id="i-max" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" /></symbol>
        <symbol id="i-restore" viewBox="0 0 16 16"><rect x="3.5" y="5.5" width="7" height="7" rx="1.5" /><path d="M6 3.5h5a1.5 1.5 0 0 1 1.5 1.5v5" /></symbol>
        <symbol id="i-close" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></symbol>
        <symbol id="i-grid" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4" height="4" rx="1" /><rect x="9.5" y="2.5" width="4" height="4" rx="1" /><rect x="2.5" y="9.5" width="4" height="4" rx="1" /><rect x="9.5" y="9.5" width="4" height="4" rx="1" /></symbol>
        <symbol id="i-full" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></symbol>
        <symbol id="i-unfull" viewBox="0 0 16 16"><path d="M6 2.5V6H2.5M13.5 6H10V2.5M10 13.5V10h3.5M2.5 10H6v3.5" /></symbol>
        <symbol id="i-gear" viewBox="0 0 16 16"><path d="M2.5 4.5h4M9.5 4.5h4M2.5 11.5h7M12.5 11.5h1" /><circle cx="8" cy="4.5" r="1.5" /><circle cx="11" cy="11.5" r="1.5" /></symbol>
        <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5l3 3" /></symbol>
    </svg>

    <div class="desktop" id="desktop">
        <header class="panel" id="panel">
            <div class="panel-start">
                <button class="brand" id="appsBtn" title="Applications" aria-haspopup="true" aria-expanded="false">
                    <svg class="ico"><use href="#i-grid" /></svg>
                    <span>Vulpes</span>
                </button>
                <nav class="pinned" id="dock" aria-label="Pinned applications"></nav>
            </div>
            <nav class="tasks" id="tasks" aria-label="Open windows"></nav>
            <div class="panel-end">
                <button class="panel-btn" id="fullscreenBtn" title="Full screen (lets apps receive Ctrl+W, Ctrl+T, Esc…)">
                    <svg class="ico"><use href="#i-full" /></svg>
                </button>
                <button class="panel-btn" id="settingsBtn" title="Settings" aria-haspopup="true" aria-expanded="false">
                    <svg class="ico"><use href="#i-gear" /></svg>
                </button>
                <time class="clock" id="clock">--:--</time>
            </div>
        </header>

        <main class="workspace" id="workspace">
            <div class="snap-preview" id="snapPreview"></div>
            <div class="empty-hint" id="emptyHint">
                <p>No windows open</p>
                <button class="link-btn" id="emptyLaunch">Open an application</button>
            </div>
        </main>

        <section class="launcher" id="appLauncher" aria-label="Applications" hidden>
            <label class="launcher-search">
                <svg class="ico"><use href="#i-search" /></svg>
                <input type="search" id="launcherSearch" placeholder="Search applications" autocomplete="off" spellcheck="false">
            </label>
            <div class="launcher-grid" id="launcherGrid"></div>
        </section>

        <section class="settings" id="settingsPanel" aria-label="Settings" hidden>
            <h2>Settings</h2>
            <div class="setting">
                <span>Theme</span>
                <div class="segmented" role="group" aria-label="Theme">
                    <button id="dark-button" class="theme-btn active" data-theme="dark">Dark</button>
                    <button id="light-button" class="theme-btn" data-theme="light">Light</button>
                </div>
            </div>
            <div class="setting">
                <label for="input-color">Main color</label>
                <div class="color-row">
                    <input type="color" id="input-color" value="#4a469e">
                    <button class="link-btn" id="resetColor">Reset</button>
                </div>
            </div>
            <div class="setting">
                <label for="zoomSelect">Window zoom (DPI)</label>
                <select class="zoom-select" id="zoomSelect">
                    <option value="0.5">50%</option>
                    <option value="0.6">60%</option>
                    <option value="0.7">70%</option>
                    <option value="0.75">75%</option>
                    <option value="0.8">80%</option>
                    <option value="0.9">90%</option>
                    <option value="1">100%</option>
                    <option value="1.1">110%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                    <option value="1.75">175%</option>
                    <option value="2">200%</option>
                </select>
            </div>
            <div class="setting">
                <label for="qualitySelect">Stream quality</label>
                <select class="zoom-select" id="qualitySelect">
                    <option value="35">Low (fast)</option>
                    <option value="60">Medium</option>
                    <option value="80">High</option>
                    <option value="95">Max</option>
                </select>
            </div>
            <div class="setting">
                <label for="statsToggle">Stream statistics</label>
                <input type="checkbox" class="switch" id="statsToggle">
            </div>
            <p class="setting-note">Full screen lets remote apps receive shortcuts the browser normally keeps, such as Ctrl+W and Ctrl+T. Hold Esc to leave it.</p>
            <div class="setting">
                <span>Session</span>
                <button class="link-btn" id="logoutBtn">Log out</button>
            </div>
        </section>

        <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>

    <script src="js/vulpes.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/window.js"></script>
    <script src="js/window_manager.js"></script>
    <script src="js/apps.js"></script>
    <script src="js/webos.js"></script>
</body>
</html>
