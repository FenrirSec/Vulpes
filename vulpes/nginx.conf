worker_processes 1;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  
  index    index.html index.htm index.php;
  sendfile     on;
  tcp_nopush   on;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream apps_api {
    server 127.0.0.1:8082;
  }

  upstream x11_api {
    server 127.0.0.1:8080;
  }

  upstream x11_websockets {
    server 127.0.0.1:8081;
  }

  server {
    listen       80;
    root /opt/webos/;

    location / {
      autoindex on;
    }

    location /apps/ {
      proxy_pass http://apps_api/;
    }

    location /webx11/ {
      proxy_pass http://x11_api/;
    }

    location ~ /term/([0-9]+)/ {
      proxy_pass http://127.0.0.1:$1/term/;
    }

    location ~ /ws/([0-9]+)/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_set_header Host $host;
      proxy_pass http://127.0.0.1:$1/ws;
    }

    location ~ /webx11/display/([0-9]+)/ws/([0-9]+) {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      proxy_set_header Host $host;
      proxy_pass http://x11_websockets/ws/$1;
    }

    # Web apps served on a local port (e.g. code-server for VS Code).
    # Reachable at /port/<port>/ , WebSocket-upgraded so the editor works.
    # The prefix is stripped (rewrite) and Host carries the port ($http_host),
    # which code-server's origin check requires.
    location ~ ^/port/([0-9]+)/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
      set $svcport $1;
      rewrite ^/port/[0-9]+/(.*)$ /$1 break;
      proxy_pass http://127.0.0.1:$svcport;
    }

  }

}
