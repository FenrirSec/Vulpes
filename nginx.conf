worker_processes 1;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  
  index    index.html index.htm index.php;
  sendfile     on;
  tcp_nopush   on;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream apps_api {
    server workstation:8082;
  }

  upstream x11_api {
    server workstation:8080;
  }

  upstream x11_websockets {
    server workstation:8081;
  }

  server {
    listen       80;
    root /opt/WebOS/;
    resolver 127.0.0.11;


    location / {
      autoindex on;
    }

    location /apps/ {
      proxy_pass http://apps_api/;
    }

    location /webx11/ {
      proxy_pass http://x11_api/;
    }

    location ~ /term/([0-9]+)/ {
      proxy_pass http://workstation:$1/term/;
    }

    location ~ /ws/([0-9]+)/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://workstation:$1/ws;
    }

    location ~ /webx11/display/([0-9]+)/ws/([0-9]+) {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://x11_websockets/ws/$1;
    }

    location ~ /workstation/([0-9|\.?]+)/([0-9]+)/ws/graphql {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://$1:$2/ws/graphql;
    }


    location ~ /workstation/([0-9|\.?]+)/([0-9]+)/display/([0-9]+)/ws/([0-9]+) {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_pass http://$1:8081/ws/$3;
    }


    location ~ /workstation/([0-9|\.?]+)/([0-9]+)/display/([0-9]+) {
      set $ip $1;
      set $port $2;
      rewrite ^/workstation/([0-9|\.?]+)/([0-9]+)/(.*)$ /$3? break;
      proxy_pass http://$ip:$port/$3;
    }

    location ~ /workstation/([0-9|\.?]+)/8080/display/([a-z]).json {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }

    location ~ /workstation/([0-9|\.?]+)/([0-9]+)/ {
      set $ip $1;
      set $port $2;
      rewrite ^/workstation/([0-9|\.?]+)/([0-9]+)/(.*)$ /$3? break;
      proxy_pass http://$ip:$port/$3;
    }

    location ~ /port/([0-9]+)/ {
      proxy_pass http://127.0.0.1:$1/;
    }

    location ~ /port/([0-9|\.?]+)/([0-9]+) {
      proxy_pass http://$1:$2/;
    }

  }

}
